apiVersion: apps/v1
kind: Deployment
metadata:
  name: favorite-deployment
  labels:
    app: favorite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: favorite
  template:
    metadata:
      labels:
        app: favorite
    spec:
      nodeSelector:
        role: backend
      containers:
      - name: favorite
        image: 205930629963.dkr.ecr.ap-northeast-2.amazonaws.com/ticket101-ecr:favorite-latest
        imagePullPolicy: Always
        ports:
          - containerPort: 5004
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
          - name: FRONTEND_URL
            valueFrom:
              secretKeyRef:
                name: app-secrets2
                key: FRONTEND_URL
          - name: FAVORITE_TABLE
            value: favoritesTable # DynamoDB 테이블 이름 추가
          - name: AWS_REGION
            value: ap-northeast-2 # 적절한 AWS 리전 값
          - name: ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: app-secrets2
                key: ACCESS_KEY_ID
          - name: SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: app-secrets2
                key: SECRET_ACCESS_KEY
