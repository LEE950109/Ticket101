apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    kubernetes.io/ingress.class: alb                           # ALB를 지정
    alb.ingress.kubernetes.io/scheme: internet-facing          # 외부 접근 가능
    alb.ingress.kubernetes.io/target-type: ip                 # Pod의 IP를 직접 대상으로 사용
spec:
  ingressClassName: alb
  rules:
    - host: ticket101.kr
      http:
        paths:
          # 프론트엔드 서비스로 라우팅
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80  
          # 각각의 백엔드 서비스를 호출할 수 있게 추가
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /api/favorites
            pathType: Prefix
            backend:
              service:
                name: favorite-service
                port:
                  number: 80
          - path: /api/performances
            pathType: Prefix
            backend:
              service:
                name: performance-service
                port:
                  number: 80
          - path: /api/search
            pathType: Prefix
            backend:
              service:
                name: search-service
                port:
                  number: 80
          - path: /api/survey
            pathType: Prefix
            backend:
              service:
                name: survey-service
                port:
                  number: 80
